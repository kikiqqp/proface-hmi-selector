<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pro-face HMI 選型</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* VOICE: 工程師遞給業務的選型手冊，冷靜、精確、一眼看懂
   IDEA: 控制盤的開孔鋼板與狀態指示燈
   PICTURE: 依實際比例畫出所有標準開口的「開孔板」，可直接點選
   COLOUR and TYPE: 白底、深青藍盤面色、訊號橘選取色；燈號綠紅琥珀只表狀態；IBM Plex Sans 配 Noto Sans TC
   LAYOUT: 電腦版左側固定條件欄、右側結果；手機版條件收進全螢幕面板，結果在第一屏
   全部尺寸使用 rem，字級切換只改 html 的 font-size */
:root{color-scheme:light dark;
 --bg:light-dark(#ffffff,#0f1719);--panel:light-dark(#f4f7f7,#162125);--ink:light-dark(#152226,#e6eeef);
 --muted:light-dark(#53636a,#9fb0b5);--line:light-dark(#d5dfe0,#2c3d42);
 --deep:#0e4a57;--deep2:light-dark(#0e4a57,#86cbd9);--acc:#d9481e;--acc-soft:light-dark(#fde9e2,#3a2119);
 --ok:light-dark(#17773f,#5fd08f);--ok-bg:light-dark(#e1f3e8,#163023);--no:light-dark(#b3311f,#ff8a7a);--no-bg:light-dark(#fbe5e1,#36191a);
 --cond:light-dark(#8a5600,#f0b85a);--cond-bg:light-dark(#fff1d2,#352a12);--unk:light-dark(#5f6f75,#9fb0b5);--unk-bg:light-dark(#edf1f2,#1f2a2e);
 --r:.75rem;--hh:0px}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
html{font-size:17px;-webkit-text-size-adjust:100%;scroll-padding-top:4.5rem}
html[data-fs=l]{font-size:19px}html[data-fs=xl]{font-size:21.5px}
@media(max-width:600px){html{font-size:16px}html[data-fs=l]{font-size:18px}html[data-fs=xl]{font-size:20px}}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:1rem/1.6 "IBM Plex Sans","Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;overflow-x:clip}
a{color:var(--deep2)}
button{font:inherit}
header{background:var(--deep);color:#fff;padding:1rem max(4vw,1rem) 0}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:.75rem;flex-wrap:wrap}
header h1{margin:0;font-size:clamp(1.5rem,3.2vw,2.1rem);line-height:1.1;font-weight:700}
header p{margin:.35rem 0 .75rem;color:#cfe6eb;font-size:.9rem}
.fs{display:flex;align-items:center;gap:.25rem;font-size:.85rem;color:#cfe6eb}
.fs button{border:1px solid #6fa3ae;background:transparent;color:#fff;border-radius:.5rem;padding:.25rem .6rem;min-height:2.2rem;cursor:pointer}
.fs button[aria-pressed=true]{background:#fff;color:var(--deep);border-color:#fff;font-weight:700}
nav{display:flex;gap:.25rem;overflow-x:auto;scrollbar-width:none}
nav button{flex:none;border:0;background:transparent;color:#d6eaee;font-weight:600;font-size:1rem;padding:.75rem 1.1rem;border-radius:.6rem .6rem 0 0;cursor:pointer;min-height:2.9rem}
nav button[aria-selected=true]{background:var(--bg);color:var(--ink)}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
main{padding:1.25rem max(4vw,1rem) 3rem;max-width:1480px;margin:0 auto}
.view{display:none}.view.on{display:block}
.grid{display:grid;grid-template-columns:minmax(0,22rem) minmax(0,1fr);gap:1.5rem;align-items:start}
.side{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:1rem}
.filters{position:sticky;top:.75rem;max-height:calc(100vh - 1.5rem);overflow:auto;overscroll-behavior:contain;padding:0}
.f-in{padding:.5rem 1rem 1rem}
.f-head{display:none}
.grp{border-bottom:1px solid var(--line)}
.grp:last-of-type{border-bottom:0}
.grp>summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:.5rem;padding:.85rem 0;font-weight:700;font-size:1rem;min-height:2.9rem}
.grp>summary::-webkit-details-marker{display:none}
.grp>summary::after{content:"";width:.55rem;height:.55rem;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin:0 .3rem .25rem auto;flex:none}
.grp[open]>summary::after{transform:rotate(225deg);margin-bottom:-.15rem}
.grp .cnt{font-size:.8rem;font-weight:600;background:var(--acc);color:#fff;border-radius:999px;padding:.05rem .55rem}
.grp .body{padding:0 0 1rem}
.tier{font-size:.8rem;color:var(--muted);margin:.6rem 0 .35rem;font-weight:600}
.tier:first-child{margin-top:0}
.side h2{font-size:1rem;margin:1rem 0 .5rem;color:var(--ink);font-weight:700}
.side h2:first-child{margin-top:0}
.chips{display:flex;flex-wrap:wrap;gap:.45rem}
.chip{border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font-size:.95rem;padding:.45rem .9rem;border-radius:999px;cursor:pointer;min-height:2.6rem;line-height:1.25;display:inline-flex;align-items:center;gap:.35rem;text-align:left}
.chip:hover{border-color:var(--deep2)}
.chip[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.chip[aria-pressed=true]::before{content:"✓"}
.chip small{opacity:.8;font-size:.8em}

.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:999px;overflow:hidden;max-width:100%}
.seg button{white-space:nowrap;border:0;background:var(--bg);color:var(--ink);padding:.45rem .9rem;min-height:2.5rem;cursor:pointer;font-size:.9rem}
.seg button+button{border-left:1.5px solid var(--line)}
.seg button[aria-pressed=true]{background:var(--deep);color:#fff;font-weight:600}
.row{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
.btn{border:1.5px solid var(--deep2);background:transparent;color:var(--deep2);font-size:.95rem;font-weight:600;padding:.5rem 1rem;border-radius:.6rem;cursor:pointer;min-height:2.75rem;text-decoration:none;display:inline-flex;align-items:center}
.btn.solid{background:var(--deep);color:#fff;border-color:var(--deep)}
.plate{border:1px solid var(--line);border-radius:.6rem;background:light-dark(#eaf0f0,#121c1f);padding:.5rem}
.plate svg{display:block;width:100%;height:auto}
.plate rect{cursor:pointer}
.hint{font-size:.85rem;color:var(--muted);margin:.4rem 0 0}
[hidden]{display:none!important}
.fbar{display:none}
.fopen{flex:1;display:flex;align-items:center;gap:.5rem;background:var(--acc);color:#fff;border:0;border-radius:.75rem;padding:.7rem 1rem;min-height:3.1rem;font-size:1.05rem;font-weight:700;cursor:pointer;box-shadow:0 .2rem .6rem rgb(0 0 0 / .18);text-align:left}
.fopen .fc{background:#fff;color:var(--acc);border-radius:999px;padding:.05rem .6rem;font-size:.85rem}
.fopen .fgo{margin-left:auto;font-weight:600;font-size:.95rem;opacity:.95}
.fopen:active{transform:translateY(1px)}
.f-tip{margin:.25rem 0 .75rem}
.res-head{display:flex;justify-content:space-between;align-items:center;gap:.75rem;flex-wrap:wrap;margin-bottom:.75rem}
.res-head h2{margin:0;font-size:clamp(1.4rem,2.4vw,1.9rem);line-height:1.15}
.active{display:flex;flex-wrap:wrap;gap:.4rem;margin:0 0 1rem}
.active .chip{background:var(--acc-soft);border-color:transparent;font-size:.85rem;min-height:2.3rem}
.active .chip::after{content:"✕";font-size:.8em;opacity:.7}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,17.5rem),1fr));gap:.85rem}
.card{border:1px solid var(--line);border-radius:var(--r);padding:1rem;background:var(--bg);display:flex;flex-direction:column;gap:.55rem}
.card.near{border-style:dashed}
.card h3{margin:0;font-size:1.2rem;line-height:1.25}
.meta{font-size:.88rem;color:var(--muted)}
.spec{display:flex;flex-wrap:wrap;gap:.25rem 1rem;font-size:.92rem}
.spec b{font-weight:600}
.near-note{margin:0 0 1rem;padding:.75rem 1rem;border-radius:var(--r);background:var(--cond-bg);color:var(--cond);font-weight:600;line-height:1.5}.near-note small{display:block;font-weight:400;margin-top:.2rem}
.miss{font-size:.88rem;color:var(--cond);background:var(--cond-bg);border-radius:.45rem;padding:.35rem .6rem}
.pills{display:flex;flex-wrap:wrap;gap:.3rem}
.pill{font-size:.82rem;border-radius:.4rem;padding:.12rem .5rem;white-space:nowrap;font-weight:500}
.s-yes{background:var(--ok-bg);color:var(--ok)}.s-no{background:var(--no-bg);color:var(--no)}
.s-cond,.s-ended{background:var(--cond-bg);color:var(--cond)}.s-unknown,.s-{background:var(--unk-bg);color:var(--unk)}
.badge{font-size:.8rem;font-weight:600;border-radius:.4rem;padding:.12rem .5rem;white-space:nowrap}
.b-full{background:var(--ok-bg);color:var(--ok)}.b-free{background:light-dark(#e0eff8,#13293a);color:var(--deep2)}.b-open-only{background:var(--cond-bg);color:var(--cond)}.b-absent{background:var(--unk-bg);color:var(--unk)}.b-eos{background:var(--no-bg);color:var(--no);font-weight:600}.b-rec{background:var(--ok-bg);color:var(--ok);font-weight:700}.b-pb3{background:light-dark(#efe7f7,#2a2036);color:light-dark(#5b3a85,#cdb6ea);font-weight:600}
.vers{display:inline-flex;flex-wrap:wrap;gap:.2rem}.vers .badge{font-weight:500}
.card .act{margin-top:auto;display:flex;gap:.45rem;flex-wrap:wrap;padding-top:.25rem}
.card .act .btn{flex:1 1 auto;justify-content:center}
.sub{margin:1.75rem 0 .65rem;font-size:1.2rem}
.detail{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:1.25rem}
.box{border:1px solid var(--line);border-radius:var(--r);padding:1rem}
.box h3{margin:0 0 .65rem;font-size:1.1rem}
table{border-collapse:collapse;width:100%;font-size:.95rem}
th,td{text-align:left;padding:.5rem .55rem;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600}
.title{font-size:clamp(1.6rem,3vw,2.2rem);line-height:1.1;margin:0 0 .4rem}
.big{font-size:1.5rem;font-weight:700}
.src{font-size:.88rem;padding-left:1.2rem}
.src li{margin:.2rem 0}
.empty{padding:1.5rem;border:1px dashed var(--line);border-radius:var(--r);color:var(--muted);text-align:center}
.cmp-wrap{overflow-x:auto}
.cmp td,.cmp th{min-width:10rem}.cmp th:first-child{min-width:8rem;position:sticky;left:0;background:var(--bg);z-index:1}
.cmp tr.diff td{background:var(--acc-soft)}
.print-only{display:none}
@media print{
 @page{size:A4 landscape;margin:10mm}
 html{font-size:10pt;color-scheme:light}
 *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
 body{background:#fff;color:#000}
 header,footer,.tray,.res-head .row,.cmp .btn{display:none!important}
 main{padding:0;max-width:none}
 .print-only{display:block;margin:0 0 .6rem;font-size:11pt}
 .res-head h2{font-size:13pt;margin:0 0 .4rem}
 .cmp-wrap{overflow:visible}
 .cmp{width:100%;table-layout:fixed;font-size:8.5pt;line-height:1.25;border-collapse:collapse}
 .cmp td,.cmp th{min-width:0;padding:.12rem .4rem;border:1px solid #bbb;word-break:break-word}
 .cmp th:first-child{position:static;width:11rem;white-space:nowrap}
 .cmp tr.diff td{background:#fde9e2}
 .cmp tr{break-inside:avoid}
}
.tray{position:sticky;bottom:0;background:var(--deep);color:#fff;padding:.65rem max(4vw,1rem);display:none;gap:.6rem;align-items:center;flex-wrap:wrap;z-index:5;padding-bottom:max(.65rem,env(safe-area-inset-bottom))}
.tray.on{display:flex}.tray .btn{color:#fff;border-color:#fff;min-height:2.5rem}
.tray span{font-size:.9rem;flex:1 1 12rem}
footer{color:var(--muted);font-size:.85rem;padding:0 max(4vw,1rem) 2rem;max-width:1480px;margin:0 auto}
.jump{display:none}
@media(max-width:1100px){.detail{grid-template-columns:minmax(0,1fr)}}
@media(max-width:900px){
 .grid{grid-template-columns:minmax(0,1fr)}
 .fbar{display:flex;position:sticky;top:0;z-index:6;gap:.5rem;align-items:center;background:var(--bg);padding:.6rem 0;margin:-.6rem 0 .6rem;border-bottom:1px solid var(--line)}
 .fbar .btn{flex:1}
 .filters{display:none;position:fixed;inset:0;z-index:20;max-height:none;border-radius:0;border:0;background:var(--bg)}
 .filters.open{display:flex;flex-direction:column}
 .f-head{display:flex;justify-content:space-between;align-items:center;padding:.75rem 1rem;border-bottom:1px solid var(--line);background:var(--panel)}
 .f-head b{font-size:1.15rem}
 .f-in{flex:1;overflow:auto}
 .jump{display:flex;position:sticky;bottom:0;gap:.5rem;padding:.75rem 1rem max(.75rem,env(safe-area-inset-bottom));background:var(--panel);border-top:1px solid var(--line)}
 .jump .btn{flex:1;justify-content:center;min-height:3rem;font-size:1rem}
 body.lock{overflow:hidden}
}
@media(max-width:600px){
 main{padding-top:.9rem}
 header p{display:none}
 header{padding-top:.75rem}
 .top{margin-bottom:.5rem}
 .stack thead{display:none}.stack tr{display:grid;padding-block:.6rem;border-bottom:1px solid var(--line)}.stack td{display:flow-root;border:0;padding:.15rem 0;padding-inline-start:7.5em;text-align:start}.stack td::before{content:attr(data-l);float:inline-start;width:7em;margin-inline-start:-7.5em;white-space:normal;color:var(--muted)}.stack td:empty{display:none}
 .card .act .btn{min-height:3rem}
}
@media(prefers-reduced-motion:no-preference){.card{transition:border-color .15s}.chip{transition:background .12s}}
</style>
<script>new MutationObserver(()=>{for(const c of document.querySelectorAll('.stack td:not([data-l])')){let i=0,p=c;while(p=p.previousElementSibling)i+=p.colSpan;c.dataset.l=c.closest('table').rows[0].cells[i]?.textContent||''}}).observe(document,{childList:true,subtree:true})</script>
</head>
<body>
<header>
 <div class="top">
  <div><h1>Pro-face HMI 選型</h1><p id="ver">載入資料中</p></div>
  <div class="fs" role="group" aria-label="字級">字級
   <button data-fs="" aria-pressed="true">標準</button><button data-fs="l" aria-pressed="false">大</button><button data-fs="xl" aria-pressed="false">特大</button>
  </div>
 </div>
 <nav role="tablist">
  <button role="tab" data-v="find">找機種</button>
  <button role="tab" data-v="model">查機種</button>
  <button role="tab" data-v="replace">舊機替換</button>
  <button role="tab" data-v="compare">比較 <span id="cmpN"></span></button>
  <button role="tab" data-v="about">說明與來源</button>
 </nav>
</header>
<main>
 <section class="view" id="v-find">
  <div class="grid">
   <aside class="side filters" id="filters" aria-label="篩選條件"></aside>
   <div>
    <div class="fbar"><button class="fopen" id="fOpen" aria-label="開啟篩選條件"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M3 5h18l-7 8v5l-4 2v-7z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg><span class="ft">篩選條件</span><span class="fc" id="fCnt"></span><span class="fgo">點此設定 ›</span></button><span class="meta" id="fNum"></span><button class="btn" id="fResetBar" hidden>重新選擇</button></div>
    <div id="findRes"></div>
   </div>
  </div>
 </section>
 <section class="view" id="v-model">
  <div class="side" style="margin-bottom:1.25rem">
   <div class="row" style="justify-content:space-between"><h2 style="margin:0">1. 選系列</h2><button class="btn" id="mReset" hidden>重新選擇</button></div><div id="mSeries"></div>
   <div id="mGroupWrap" hidden><h2>2. 選子系列</h2><div class="chips" id="mGroups"></div></div>
   <h2 id="mModelsH">2. 選機種</h2><div class="chips" id="mModels"><span class="hint">先選系列</span></div>
   <div id="mBoxWrap" hidden><h2>3. 選 Box</h2><div class="chips" id="mBoxes"></div></div>
  </div>
  <div id="mDetail"><div class="empty">選一個機種，這裡會顯示規格、遠端功能支援、開口尺寸與替換建議</div></div>
 </section>
 <section class="view" id="v-replace">
  <div class="side" style="margin-bottom:1.25rem">
   <div class="row" style="justify-content:space-between"><h2 style="margin:0">1. 現場舊機的系列</h2><button class="btn" id="rReset" hidden>重新選擇</button></div><div id="rSeries"></div>
   <div id="rGroupWrap" hidden><h2>2. 子系列</h2><div class="chips" id="rGroups"></div></div>
   <h2 id="rModelsH">2. 舊機型號</h2><div class="chips" id="rModels"><span class="hint">先選系列</span></div>
  </div>
  <div id="rDetail"><div class="empty">選擇現場的舊機，這裡會列出原廠建議替換機種，以及開口相同、可直接換裝的現行機種</div></div>
 </section>
 <section class="view" id="v-compare"><div id="cmp"></div></section>
 <section class="view" id="v-about"><div id="about"></div></section>
</main>
<div class="tray" id="tray"><span id="trayTxt"></span><button class="btn" id="trayGo">開始比較</button><button class="btn" id="trayClr">清空</button></div>
<footer>本工具為初步選型。正式採購、改孔或替換前，請依確切型號、硬體版本、GP-Pro EX 版本與原廠最新文件確認。</footer>
<script src="data/hmi-data.js"></script>
<script>
{
const D = window.HMI_DATA;
const $ = s => document.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const FK = ['remoteHmi','gpViewer','proFaceConnect','ftp','email','ipsec','web','ezLan'];
const SLAB = {yes:'支援',no:'不支援',cond:'有條件',ended:'舊版才有',unknown:'待確認'};
const VS = {full:'✓', free:'✓ 免費版', 'open-only':'僅開啟', absent:'未收錄'};
const VLONG = {full:'可新建', free:'可新建（免費版可用）', 'open-only':'僅可開啟，不可新建', absent:'未收錄'};
const TOUCH = {'analog':'類比電阻','analog(multi-touch)':'類比電阻多點','p-cap(multi-touch)':'投射電容多點','matrix':'矩陣電阻','none':'無'};
const WIDE = new Set(['WVGA','WQVGA','NCPQVGA','WSVGA','WXGA','FWXGA','FullHD','WXGAV']);
const store = {get(k,d){try{return JSON.parse(localStorage.getItem('pfsel.'+k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem('pfsel.'+k,JSON.stringify(v))}catch(e){}}};

if (!D) { $('#ver').textContent = '找不到資料檔 data/hmi-data.js'; throw new Error('no data'); }

/* ---------- 資料整理 ---------- */
const M = D.models;
const byKey = new Map(M.map(m => [m.key, m]));
const ser = k => D.series[k] || {label:k, order:99, tier:'', url:''};
const isSP = m => m.series === 'SP5000';
const spDisp = m => m.name === 'DC Power Supply Adapter' ? 'DC 電源轉接（Box 單獨）' : m.name.slice(0,2) + '-' + m.name.slice(2,-1);
const spBox = m => m.group.replace('/5B41*', 'x');
const clean = n => n.replace(/\s+\S+\s*\(\d+\*\d+\)$/, '');
const name = m => isSP(m) ? spDisp(m) + ' + ' + spBox(m) : clean(m.name);
const f = (m,k) => (m.features && m.features[k]) || {};
const cutKey = c => !c ? '' : c.w ? c.w + '×' + c.h : c.d ? 'φ' + c.d : '';
const cutTxt = c => {
  if (!c) return '未建檔';
  if (c.w) return c.w + ' × ' + c.h + ' mm';
  if (c.d) return 'φ' + c.d + ' mm 圓孔';
  return {box:'不適用（盒型）',handheld:'不適用（手持）',ipc:'不適用（IPC）',round:'圓孔，孔徑待查',rect:'待查'}[c.mount] || '未建檔';
};
const portN = v => v == null ? '未標示' : v ? v + ' 埠' : '無';
const comHas = (m,t) => m.com.some(c => c.type.includes(t));
const resTxt = m => [m.resolution, m.resolutionPx].filter(Boolean).join(' ');
const srcLink = id => { const s = D.sources[id]; if (!s) return ''; return s.url ? `<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title)}</a>` : esc(s.title); };
const current = m => ['full','free'].includes(m.statusLatest);

const sizeBuckets = [
  {id:'s4', lab:'4.3 吋以下', t:i => i <= 4.3},
  {id:'s5', lab:'5.7 吋', t:i => i > 4.3 && i < 6.5},

const SW_OPTS = [['blue','BLUE 可用'],['bos','BLUE Open Studio 可用']];
function check(m) {

function renderFind() {

    ${n ? `<div class="active">${activeList().map(([f,v,l]) => `<button class="chip" data-rm="${esc(f)}" data-v="${esc(v)}" aria-label="移除條件 ${esc(l)}">${esc(l)}</button>`).join('')}<button class="chip" data-rm="*" data-v="">全部清除</button></div>`
       : '<p class="meta" style="margin-top:0">點選條件開始篩選，所有版本收錄的機種都會列出。</p>'}
    ${full.length ? `<div class="cards">${full.map(i => card(i,false)).join('')}</div>` : `<div class="empty">沒有完全符合的機種，請看下方接近機種，或減少條件</div>`}
    ${near.length ? `<h3 class="sub">接近機種（差 1～2 項）</h3><div class="cards">${near.slice(0,30).map(i => card(i,true)).join('')}</div>` : ''}`;

function activeList() {

     <div class="pills">${pills(x, ['remoteHmi','gpViewer','proFaceConnect','ftp','email'])}</div>
     ${d.length ? `<div class="miss">比舊機少：${esc(d.join('、'))}</div>` : '<div class="pill s-yes" style="align-self:flex-start">功能不少於舊機</div>'}
     <div class="act"><button class="btn solid" data-open="${esc(x.key)}">詳細</button><button class="btn" data-pair="${esc(m.key)}::${esc(x.key)}">與舊機比較</button></div></article>`;
}
function nearHtml(m) {
  const why = noSameTxt(m);
  if (why) return `<div class="empty">${esc(why)}</div>`;
  const n = nearCut(m);
  const head = `<div class="near-note">沒有開口相同規格的現行機種，以下只是開口尺寸相近的機種，不是同規格。<small>依開口尺寸推算，不是原廠建議。換裝需擴孔或加轉接板，施工前請確認新機外框、盤內深度與原廠外形圖。同一系列只列最接近的一款，差距超過 ${NEAR_MAX} mm 不列。</small></div>`;
  const sec = (t, list, none) => `<h3 class="sub">${t}</h3>${list.length ? `<div class="cards">${list.map(r => nearCard(m, r)).join('')}</div>` : `<div class="empty">${none}</div>`}`;
  if (!n.big.length && !n.small.length) return head + `<div class="empty">${NEAR_MAX} mm 內沒有開口相近的現行機種</div>`;
  return head
    + sec('相近開口：擴孔即可（新機開口較大）', n.big, '沒有開口較大的相近機種')
    + sec('相近開口：需轉接板或補板（新機開口較小）', n.small, '沒有開口較小的相近機種');
}
$('#v-replace').addEventListener('click', e => {
  if (e.target.closest('#rReset')) { rSel = {series:'', group:'', model:''}; renderReplacePick(); $('#rDetail').innerHTML = R_EMPTY; window.scrollTo({top:0, behavior:'smooth'}); return; }
  const s = e.target.closest('[data-rs]'), g = e.target.closest('[data-rg]'), k = e.target.closest('[data-rk]'), p = e.target.closest('[data-pair]');
  if (s) { rSel = {series:s.dataset.rs, group:'', model:''}; renderReplacePick(); }
  else if (g) { rSel.group = g.dataset.rg; rSel.model = ''; renderReplacePick(); }
  else if (k) { rSel.model = k.dataset.rk; renderReplacePick(); renderReplace(byKey.get(rSel.model)); $('#rDetail').scrollIntoView({behavior:'smooth', block:'start'}); }
  else if (p) { cmp = p.dataset.pair.split('::'); store.set('cmp', cmp); go('compare'); }
});

/* ---------- 比較 ---------- */
function renderCompare() {
  const ms = cmp.map(k => byKey.get(k)).filter(Boolean);
  if (!ms.length) { $('#cmp').innerHTML = '<div class="empty">還沒有加入比較的機種。在找機種或查機種按「加入比較」，最多 4 台</div>'; return; }
  const rows = [
    ['系列', m => ser(m.series).label], ...VERS.map(v => ['GP-Pro EX ' + v, m => VLONG[vst(m,v)]]), ['尺寸', m => m.inch ? m.inch + ' 吋' : '不適用'],
    ['解析度', resTxt], ['開口', m => cutTxt(m.cutout)],
    ...FK.map(k => [D.featureDefs[k].label, m => { const v = f(m,k); return (SLAB[v.s] || '待確認') + (v.conn ? `（${v.conn} 台）` : ''); }]),
    ['LAN 埠', m => portN(m.ethernet)], ['COM 埠', m => m.com.map(c => c.port + ' ' + c.type).join('、')], ['USB A', m => portN(m.usbA)],
    ['記憶卡槽', m => m.cardSlot ? '有' : '無'], ['觸控', m => TOUCH[m.touch] || ''], ['畫面記憶體', m => m.appMemoryMB ? m.appMemoryMB + ' MB' : ''],
    ['傳輸線', m => m.cable ? m.cable.t : '待確認'], ['開發軟體', m => m.software || 'GP-Pro EX'],
    ['BLUE', m => softTxt(m, 'blue')], ['BLUE Open Studio', m => softTxt(m, 'bos')], ['停售／停修', m => eosTxt(m) || '未列於原廠停售清單']];
  const today = new Date().toLocaleDateString('sv-SE');
  $('#cmp').innerHTML = `<div class="print-only"><b>Pro-face HMI 機種比較</b>　列印日期 ${today}${D.updated ? '　資料庫日期 ' + esc(D.updated) : ''}</div><div class="res-head"><h2>比較 ${ms.length} 台</h2><div class="row"><span class="meta">底色標示有差異的項目</span><button class="btn solid" id="cmpPrint">列印／存成 PDF</button><button class="btn" id="cmpClr">清空</button></div></div>
   <div class="cmp-wrap"><table class="cmp"><thead><tr><th>項目</th>${ms.map(m => `<th>${esc(name(m))}<br><button class="btn" style="margin-top:0.375rem" data-cmp="${esc(m.key)}">移出</button></th>`).join('')}</tr></thead>
   <tbody>${rows.map(([l, fn]) => { const v = ms.map(m => String(fn(m))); const diff = new Set(v).size > 1;
     return `<tr class="${diff ? 'diff' : ''}"><th>${esc(l)}</th>${v.map(x => `<td>${esc(x)}</td>`).join('')}</tr>`; }).join('')}</tbody></table></div>`;
}

/* ---------- 說明 ---------- */
function renderAbout() {
  $('#about').innerHTML = `
   <div class="detail">
    <div class="box"><h3>遠端功能說明</h3><table class="stack"><thead><tr><th>功能</th><th>說明</th></tr></thead><tbody>${FK.map(k => `<tr><td>${esc(D.featureDefs[k].label)}</td><td>${esc(D.featureDefs[k].desc)} ${(D.featureDefs[k].src||[]).map(srcLink).join('、')}</td></tr>`).join('')}</tbody></table></div>
    <div class="box"><h3>標示意義</h3><table><tbody>
     ${Object.entries(SLAB).map(([k,v]) => `<tr><td><span class="pill s-${k}">${v}</span></td><td>${{yes:'原廠文件明確支援',no:'原廠文件明確不支援',cond:'需符合特定條件，詳見備註',ended:'只有較舊的 GP-Pro EX 版本支援',unknown:'尚未找到原廠明確資料'}[k]}</td></tr>`).join('')}
     ${Object.entries(VS).map(([k,v]) => `<tr><td><span class="badge b-${k}">${esc(VERS[VERS.length-1])} ${v}</span></td><td>${esc(D.status[k] || VLONG[k])}</td></tr>`).join('')}
     <tr><td><span class="badge b-eos">已停售 2025/06/30</span></td><td>原廠停售與推薦替換產品頁列出的停售日已過，日期為最早的停售日；停修日寫在規格表</td></tr>
     <tr><td><span class="badge b-rec">原廠建議</span></td><td>舊機替換時，開口相同的機種同時是原廠建議的替換機種，排在最前面</td></tr>
     <tr><td><span class="badge b-pb3">PB III 舊硬體</span></td><td>只用於舊硬體（例如 GP2000 系列）：開發軟體為 GP-PRO/PB III，GP-Pro EX 不能直接選這台開發，所以不顯示 GP-Pro EX 版本標籤。舊專案可用 GP-Pro EX 工程轉換器轉到現行機種，對應機種寫在規格與舊機替換頁</td></tr>
    </tbody></table>
    <h3 style="margin-top:1.12rem">資料版本</h3><p class="meta">機種清單取自 GP-Pro EX ${esc(VERS.join('、'))} 的 HmiInfo.xml，取聯集共 ${M.length} 筆，每台機種分別標示各版本的支援狀態。${D.updated ? `資料庫日期 ${esc(D.updated)}（台灣時間，資料有變更時才更新）。` : ''}功能、開口與替換資料依原廠手冊與網頁整理，每筆附來源。</p></div>
   </div>
   ${(D.switches || []).length ? `<div class="box" style="margin-top:1.25rem"><h3>特殊開關切換</h3><p class="meta">${SW_HINT}「適用」空白者為通用開關。</p>
    <table class="stack"><thead><tr><th>開關</th><th>說明</th><th>適用</th><th>補充</th></tr></thead><tbody>${D.switches.map(x => `<tr><td>${esc(x.sw)}</td><td>${esc(x.zh || x.en)}${x.zh && x.en && x.en !== 'Reserved' ? `<br><span class="meta">${esc(x.en)}</span>` : ''}</td><td>${esc(x.series ? ser(x.series).label + (x.use ? '：' + x.use : '') : '')}</td><td>${esc(x.n)}</td></tr>`).join('')}</tbody></table></div>` : ''}
   ${cableBox()}
   ${softBox()}
   <div class="box" style="margin-top:1.25rem"><h3>全部資料來源</h3><ul class="src">${Object.keys(D.sources).map(k => `<li>${srcLink(k)}</li>`).join('')}</ul></div>`;
}

function softBox() {
  const lab = k => { const by = new Map(); for (const m of M) { const v = (m.soft || {})[k]; if (!v || v.s === 'no') continue; const key = ser(m.series).label; if (!by.has(key)) by.set(key, new Set()); by.get(key).add(SLAB[v.s] + (v.v ? '，' + v.v : '') + (v.n && v.n !== v.v ? '（' + v.n + '）' : '')); }
    return [...by].map(([s, set]) => `<li><b>${esc(s)}</b>：${esc([...set].join('；'))}</li>`).join(''); };
  return `<div class="box" style="margin-top:1.25rem"><h3>BLUE／BLUE Open Studio 支援機種</h3><p class="meta">依原廠支援機種頁整理；清單未列的機種標為不支援。BLUE Open Studio 另支援 STM6000 Edge Box HMI（PFXSTM6B00DIOT，需 2020 SP2 以上），此型號不在 GP-Pro EX 機種清單內。</p>
   <h4>BLUE</h4><ul class="src">${lab('blue')}</ul><h4>BLUE Open Studio</h4><ul class="src">${lab('bos')}</ul>
   <ul class="src"><li>${srcLink('S_BLUE_MODEL')}</li><li>${srcLink('S_BOS_MODEL')}</li><li>${srcLink('S_BOS_EDGE')}</li></ul></div>`;
}
function cableBox() {
  const by = k => seriesList.filter(sk => M.some(m => m.series === sk && (m.cable?.kinds || []).includes(k)));
  const only = by('USB A').filter(sk => M.filter(m => m.series === sk && m.cable).every(m => m.cable.kinds.join() === 'USB A'));
  const also = by('USB A').filter(sk => !only.includes(sk));
  const lab = a => a.map(sk => ser(sk).label.replace(/（舊）$/, '')).join('、');
  const srcs = [...new Set(M.map(m => m.cable?.src).filter(Boolean).flatMap(x => x.split('|')))];
  return `<div class="box" style="margin-top:1.25rem"><h3>傳輸線</h3><table class="stack"><thead><tr><th>型式</th><th>適用</th></tr></thead><tbody>
   <tr><td>USB A 對 USB A 專用傳輸線 CA3-USBCB-01（原廠，已停產）</td><td>只能用這條線：${esc(lab(only))}。<br>也可以用：${esc(lab(also))}（GP-4104 至 4107 不行）。<br>這是需要安裝驅動程式的專用連結線，一般 USB A 對 A 線不能代替；不支援 GP2000 與 GP-PRO/PB III C-Package。</td></tr>
   <tr><td>USB A 對 mini-B</td><td>${esc(lab(by('USB mini-B')))}，一般市售線即可</td></tr>
   <tr><td>USB A 對 micro-B</td><td>${esc(lab(by('USB micro-B')))}，一般市售線即可</td></tr>
   <tr><td>圓形 Tool 連接埠</td><td>${esc(lab(by('Tool')))}：依機種為 GPW-CB02（RS-232C）、GPW-CB03（USB）或 GPW-CB-SET，也有市售相容線</td></tr>
  </tbody></table><p class="hint">尚未建檔：${esc(lab(seriesList.filter(sk => M.some(m => m.series === sk && !m.cable))))}。</p>
  <ul class="src">${srcs.map(x => `<li>${srcLink(x)}</li>`).join('')}</ul></div>`;
}

/* ---------- 分頁 ---------- */
const VIEWS = ['find','model','replace','compare','about'];
let cur = '';
function go(v) {
  if (!VIEWS.includes(v)) v = 'find';
  cur = v;
  document.querySelectorAll('nav button').forEach(b => b.setAttribute('aria-selected', b.dataset.v === v));
  document.querySelectorAll('.view').forEach(s => s.classList.toggle('on', s.id === 'v-' + v));
  if (v === 'compare') renderCompare();
  if (location.hash.slice(1) !== v) history.replaceState(null, '', '#' + v);
  renderTray();
}
function openModel(k) {
  const m = byKey.get(k); if (!m) return;
  mSel = {series:m.series, group: subGroups(m.series).length ? m.group : '', model:k, disp: isSP(m) ? spDisp(m) : ''};
  renderModelPick(); renderDetail(m, '#mDetail'); go('model'); window.scrollTo({top:0});
}
document.querySelector('nav').addEventListener('click', e => { const b = e.target.closest('button'); if (b) go(b.dataset.v); });
document.addEventListener('click', e => {
  const o = e.target.closest('[data-open]'), c = e.target.closest('[data-cmp]');
  if (o) openModel(o.dataset.open);
  else if (c) toggleCmp(c.dataset.cmp);
  else if (e.target.closest('#trayGo')) go('compare');
  else if (e.target.closest('#cmpPrint')) window.print();
  else if (e.target.closest('#trayClr') || e.target.closest('#cmpClr')) { cmp = []; store.set('cmp', cmp); renderTray(); renderFind(); renderCompare(); }
});
window.addEventListener('hashchange', () => go(location.hash.slice(1)));

function setFs(v) {
  if (v) document.documentElement.dataset.fs = v; else delete document.documentElement.dataset.fs;
  document.querySelectorAll('.fs button').forEach(b => b.setAttribute('aria-pressed', b.dataset.fs === v));
  store.set('fs', v);
}
document.querySelector('.fs').addEventListener('click', e => { const b = e.target.closest('button'); if (b) setFs(b.dataset.fs); });
setFs(store.get('fs', ''));
$('#ver').textContent = `機種資料 ${M.length} 筆` + (D.updated ? `，資料庫日期: ${D.updated}` : '');
renderFilters(); renderFind(); renderModelPick(); renderReplacePick(); renderAbout();
go(location.hash.slice(1) || 'find');
}
</script>
</body>
</html>
